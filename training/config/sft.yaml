# Full fine-tune hyperparameters. Effective batch:
# per_device_batch(4) * grad_accum(4) * world_size(4) = 64 samples/step.

model: Qwen/Qwen2.5-7B-Instruct
dataset_path: /mnt/data/jg/datasets/mmlu_sft.jsonl
output_dir: /mnt/data/jg/checkpoints/qwen25-7b-mmlu-sft

epochs: 1
max_steps: -1            # -1 = use epochs
per_device_batch: 4
grad_accum: 4
lr: 2.0e-5
lr_schedule: cosine
warmup_ratio: 0.03
weight_decay: 0.0
max_seq_length: 1024
grad_checkpointing: true

logging_steps: 10
save_steps: 250
save_total_limit: 2

packing: false           # off so completion-only loss masking stays clean
optim: adamw_torch_fused
seed: 42
dataloader_num_workers: 4
